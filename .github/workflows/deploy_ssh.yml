name: Deploy ssh v2

on: 
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v4
    - name: Setup Ruby 💎
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3.5"
        bundler-cache: true
    - name: Setup Python 🐍
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip" # caching pip dependencies
    - name: Cache APT imagemagick
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: imagemagick
        version: 1.0
    - name: Update _config.yml ⚙️
      uses: fjogeleit/yaml-update-action@main
      with:
        commitChange: false
        valueFile: "_config.yml"
        propertyPath: "giscus.repo"
        value: ${{ github.repository }}
    - name: Install and Build 🔧
      # sudo apt-get update && sudo apt-get install -y imagemagick
      run: |
        pip3 install -r requirements.txt
        export JEKYLL_ENV=production
        bundle exec jekyll build
    - name: Purge unused CSS 🧹
      run: |
        npm install -g purgecss
        purgecss -c purgecss.config.js
    - name: Clean and Move files
      run: yes | bin/move_file
    # - name: copy file via ssh password
    #   uses: appleboy/scp-action@master
    #   with:
    #     host: ${{ secrets.VM_PUBLIC_IP }}
    #     username: ${{ secrets.DEPLOY_USERNAME }}
    #     key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
    #     port: ${{ secrets.VM_PORT }}
    #     source: "."
    #     target: ${{ secrets.VM_DEPLOY_PATH }}
    #     overwrite: true
    - name: Deploy via Rsync
      uses: Burnett01/rsync-deployments@7.0.1
      with:
        # -a: archive mode, -v: verbose, -z: compress during transfer
        # --no-perms/owner/group: the magic fix for your "Operation not permitted" error
        switches: -avz --no-perms --no-owner --no-group --delete
        path: "."
        remote_path: ${{ secrets.VM_DEPLOY_PATH }}
        remote_host: ${{ secrets.VM_PUBLIC_IP }}
        remote_user: ${{ secrets.DEPLOY_USERNAME }}
        remote_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
